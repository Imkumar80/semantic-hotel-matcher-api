matching:
  auto_match_threshold: 0.92
  llm_review_threshold: 0.75      # below this = no match, no LLM call
  radius_meters: 250
  max_candidates_per_hotel: 10

weights:
  name: 0.30
  embedding: 0.25
  address: 0.20
  distance: 0.15
  amenities: 0.10

rooms:
  match_threshold: 0.65

models:
  embedding_model: "BAAI/bge-small-en-v1.5"
  llm_model: "gemini-2.5-flash"        # Pinned. Requires GEMINI_API_KEY to be set in environment.
